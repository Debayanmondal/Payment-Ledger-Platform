apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: banking-platform
  labels:
    app: ledger-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: debayanmondal/ledger-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.banking-platform.svc.cluster.local:5432/ledger_db"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking-platform.svc.cluster.local:9092"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: banking-platform
spec:
  type: ClusterIP
  selector:
    app: ledger-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
